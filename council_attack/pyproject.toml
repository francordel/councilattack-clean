[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "council-attack"
description = "CouncilAttack - deliberative multi-model red-teaming pipeline (standalone)"
requires-python = ">=3.11"
authors = [
  {name = "Francisco J. Cortés-Delgado"},
  {name = "Mario Rodríguez Béjar"},
  {name = "Giulio Zizzo"},
  {name = "William F. Shen"},
  {name = "Antonio Skarmeta"},
  {name = "Stefano Braghin"},
  {name = "Jose L. Hernandez-Ramos"},
]
license = "MIT"
dependencies = [
    "requests",
    "PyYAML",
]
version = "0.1"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
